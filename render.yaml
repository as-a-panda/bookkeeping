services:
  - type: web
    name: bookkeeping-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: bookkeeping-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bookkeeping-frontend.vercel.app

databases:
  - name: bookkeeping-db
    region: singapore
    plan: free
    databaseName: bookkeeping
    ipAllowList: []
